# Wall detection settings
wall_detection:
  enabled: true
  edge_threshold1: 50
  edge_threshold2: 150
  min_wall_area: 1000
  aspect_ratio_threshold: 3.0

# Enhanced obstacle analysis
obstacle_analysis:
  enable_danger_assessment: true
  enable_directional_guidance: true
  enable_wall_detection: true
  priority_objects: ["person", "car", "motorcycle", "bicycle", "wall", "chair", "dining table"]